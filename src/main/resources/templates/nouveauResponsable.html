<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouveau programmeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Ajout d'un nouveau responsable</h1>

    <form th:action="@{/api/personnes/addResponsable}" th:object="${nouveauResponsable}" method="POST">

        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50">

        <label class="form-label" for="prenom">Prénom</label>
        <input type="text" th:field="*{prenom}" class="form-control mb-3 w-50">

        <label class="form-label" for="email">Email</label>
        <input type="text" th:field="*{login}" class="form-control mb-3 w-50">

        <label class="form-label" for="prenom">Mot de passe</label>
        <input type="text" th:field="*{motDePasse}" class="form-control mb-3 w-50">

        <button type="submit" class="btn btn-primary">Enregistrez</button>
    </form>

    <hr>
    <a th:href="@{/api/personnes/getResponsables}">Afficher la liste des responsables</a>
</div>
</body>
</html>
