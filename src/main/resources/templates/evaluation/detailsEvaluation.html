<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails de l'évaluation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Détails de l'évaluation</h1>

    <dl class="row">
        <dt class="col-sm-3">Id</dt>
        <dd class="col-sm-9" th:text="${evaluation.id}"></dd>

        <dt class="col-sm-3">Prestataire évalué</dt>
        <dd class="col-sm-9" th:text="${evaluation.incident.prestataire.nom}"></dd>

        <dt class="col-sm-3">Incident</dt>
        <dd class="col-sm-9" th:text="${evaluation.incident.id}"></dd>

        <dt class="col-sm-3">Équipement</dt>
        <dd class="col-sm-9"
            th:text="${evaluation.incident.equipement.id + ' - ' + evaluation.incident.equipement.description}"></dd>

        <dt class="col-sm-3">Agent</dt>
        <dd class="col-sm-9"
            th:text="${evaluation.incident.agent.prenom + ' ' + evaluation.incident.agent.nom}"></dd>

        <dt class="col-sm-3">Note</dt>
        <dd class="col-sm-9" th:text="${evaluation.note + ' / 5'}"></dd>

        <dt class="col-sm-3">Date</dt>
        <dd class="col-sm-9" th:text="${evaluation.date}"></dd>

        <dt class="col-sm-3">Commentaire</dt>
        <dd class="col-sm-9" th:text="${evaluation.commentaire ?: 'Aucun commentaire'}"></dd>
    </dl>

    <p class="text-muted">Les évaluations sont conservées dans l'historique et ne sont pas modifiables.</p>
    <a th:href="@{/api/evaluations/getEvaluations}">Retour à la liste des évaluations</a>
</div>
</body>
</html>
