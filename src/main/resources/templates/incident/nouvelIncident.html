<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Déclarer un incident</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Déclarer un incident</h1>

    <form th:action="@{/api/incidents/addIncident}"
          th:object="${nouvelIncident}"
          method="POST">
        <label class="form-label" for="equipementId">Équipement</label>
        <select th:field="*{equipementId}" class="form-select mb-3 w-50" required>
            <option value="" disabled>Choisir un équipement</option>
            <option th:each="equipement : ${equipements}"
                    th:value="${equipement.id}"
                    th:text="${equipement.id + ' - ' + equipement.description}">
            </option>
        </select>

        <label class="form-label" for="agentId">Agent déclarant</label>
        <select th:field="*{agentId}" class="form-select mb-3 w-50" required>
            <option value="" disabled>Choisir un agent</option>
            <option th:each="agent : ${agents}"
                    th:value="${agent.id}"
                    th:text="${agent.prenom + ' ' + agent.nom + ' (' + agent.login + ')'}">
            </option>
        </select>

        <label class="form-label" for="prestataireId">Prestataire (facultatif)</label>
        <select th:field="*{prestataireId}" class="form-select mb-3 w-50">
            <option value="">Aucun prestataire</option>
            <option th:each="prestataire : ${prestataires}"
                    th:value="${prestataire.id}"
                    th:text="${prestataire.nom}">
            </option>
        </select>

        <label class="form-label" for="description">Description</label>
        <textarea th:field="*{description}" class="form-control mb-3 w-50"
                  maxlength="2000" rows="4" required></textarea>

        <button type="submit" class="btn btn-primary">Enregistrer l'incident</button>
    </form>

    <hr>
    <a th:href="@{/api/incidents/getIncidents}">Afficher la liste des incidents</a>
</div>
</body>
</html>
