<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des agents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h1>Liste des stations</h1>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Nom</th>
            <th scope="col">Adresse</th>
            <th scope="col">Ville</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="station : ${stations}">
            <td th:text="${station.id}"></td>
            <td th:text="${station.nom}"></td>
            <td th:text="${station.adresse}"></td>
            <td th:text="${station.ville}"></td>
            <td>
                <form th:action="@{/api/stations/getStation/{idStation}(idStation=${station.id})}" style="display:inline;">
                    <button class="btn btn-info btn-sm">Détails</button>
                </form>

                <form th:action="@{/api/stations/station/{idStation}(idStation=${station.id})}" th:method="DELETE" style="display:inline;">
                    <button class="btn btn-warning btn-sm">Supprimez</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(stations)}">
            <td colspan="8" class="text-center text-muted">Aucune station.</td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/api/stations/station/nouveau}">
        <button class="btn btn-primary">Ajoutez</button>
    </form>

</div>
</body>
</html>
