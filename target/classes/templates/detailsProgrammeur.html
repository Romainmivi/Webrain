<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails du programmeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Détails du programmeur</h1>

    <section id="programmeurDetails">
        <dl class="row">
            <dt class="col-sm-3">Nom</dt>
            <dd class="col-sm-9" th:text="${programmeur.nom}"></dd>
            <dt class="col-sm-3">Prénom</dt>
            <dd class="col-sm-9" th:text="${programmeur.prenom}"></dd>
            <dt class="col-sm-3">Adresse</dt>
            <dd class="col-sm-9" th:text="${programmeur.adresse}"></dd>
            <dt class="col-sm-3">Langage d'expertise</dt>
            <dd class="col-sm-9" th:text="${programmeur.langageExpertise}"></dd>
            <dt class="col-sm-3">Livre préféré</dt>
            <dd class="col-sm-9" th:text="${programmeur.livrePrefere}"></dd>
            <dt class="col-sm-3">Salaire</dt>
            <dd class="col-sm-9" th:text="${programmeur.salaire}"></dd>
        </dl>
        <button type="button" class="btn btn-primary" onclick="toggleEdit(true)">Modifier</button>
    </section>

    <form id="programmeurForm" hidden
          th:object="${programmeur}"
          th:action="@{/programmeurs/{id}(id=${programmeur.id})}"
          th:method="PUT">
        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50" required>
        <label class="form-label" for="prenom">Prénom</label>
        <input type="text" th:field="*{prenom}" class="form-control mb-3 w-50" required>
        <label class="form-label" for="adresse">Adresse</label>
        <input type="text" th:field="*{adresse}" class="form-control mb-3 w-50">
        <label class="form-label" for="langageExpertise">Langage d'expertise</label>
        <input type="text" th:field="*{langageExpertise}" class="form-control mb-3 w-50">
        <label class="form-label" for="livrePrefere">Livre préféré</label>
        <input type="text" th:field="*{livrePrefere}" class="form-control mb-3 w-50">
        <label class="form-label" for="salaire">Salaire</label>
        <input type="number" step="any" th:field="*{salaire}" class="form-control mb-3 w-50">
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <button type="button" class="btn btn-secondary" onclick="toggleEdit(false)">Annuler</button>
    </form>

    <hr>
    <a th:href="@{/programmeurs}">Retour à la liste des programmeurs</a>
</div>
<script>
    function toggleEdit(editing) {
        document.getElementById("programmeurDetails").hidden = editing;
        document.getElementById("programmeurForm").hidden = !editing;
    }
</script>
</body>
</html>
