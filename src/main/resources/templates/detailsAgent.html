<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ALTN72 - TP Fil Rouge - Un programmeur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Details agent</h1>

    <form th:object="${agent}" th:action="@{/api/personnes/getAgent/{idAgent}(idAgent=${agent.id})}" th:method="PUT">

        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50">

        <label class="form-label" for="prenom">Prénom</label>
        <input type="text" th:field="*{prenom}" class="form-control mb-3 w-50">

        <label class="form-label" for="login">login</label>
        <input type="text" th:field="*{login}" class="form-control mb-3 w-50">

        <button type="submit" class="btn btn-primary">Validez modifications</button>
    </form>

    <hr>
    <a th:href="@{/api/personnes/getAgents}">Afficher la liste des agents</a>
</div>
</body>
</html>
