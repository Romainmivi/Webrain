<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails de l'agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Détails de l'agent</h1>

    <section id="agentDetails">
        <dl class="row">
            <dt class="col-sm-3">Nom</dt>
            <dd class="col-sm-9" th:text="${agent.nom}"></dd>
            <dt class="col-sm-3">Prénom</dt>
            <dd class="col-sm-9" th:text="${agent.prenom}"></dd>
            <dt class="col-sm-3">Login</dt>
            <dd class="col-sm-9" th:text="${agent.login}"></dd>
        </dl>
        <button type="button" class="btn btn-primary" onclick="toggleEdit(true)">Modifier</button>
    </section>

    <form id="agentForm" hidden
          th:object="${agent}"
          th:action="@{/api/personnes/getAgent/{id}(id=${agent.id})}"
          th:method="PUT">
        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50" required>
        <label class="form-label" for="prenom">Prénom</label>
        <input type="text" th:field="*{prenom}" class="form-control mb-3 w-50" required>
        <label class="form-label" for="login">Login</label>
        <input type="text" th:field="*{login}" class="form-control mb-3 w-50" required>
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <button type="button" class="btn btn-secondary" onclick="toggleEdit(false)">Annuler</button>
    </form>

    <hr>
    <a th:href="@{/api/personnes/getAgents}">Retour à la liste des agents</a>
</div>
<script>
    function toggleEdit(editing) {
        document.getElementById("agentDetails").hidden = editing;
        document.getElementById("agentForm").hidden = !editing;
    }
</script>
</body>
</html>
