<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titreErreur} + ' - Webrain'">Erreur - Webrain</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .error-card {
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .error-icon {
            font-size: 4rem;
            color: #ffc107;
        }
    </style>
</head>
<body>
<div class="error-card">
    <div class="error-icon mb-3">🔍</div>
    <h2 class="mb-3" th:text="${titreErreur}">Page non trouvée</h2>
    <p class="text-muted mb-4" th:text="${erreur}">La ressource demandée n'a pas été trouvée.</p>
    <a th:href="@{/dashboard}" class="btn btn-primary">Retour au tableau de bord</a>
</div>
</body>
</html>
