<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des équipements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h1>Liste des équipements</h1>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Description</th>
            <th scope="col">Type</th>
            <th scope="col">Station</th>
            <th scope="col">État</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="equipement : ${equipements}">
            <td th:text="${equipement.id}"></td>
            <td th:text="${equipement.description}"></td>
            <td th:text="${equipement.type}"></td>
            <td th:text="${equipement.station.nom}"></td>
            <td th:text="${equipement.etat}"></td>
            <td>
                <form th:action="@{/api/equipements/getEquipement/{idEquipement}(idEquipement=${equipement.id})}" style="display:inline;">
                    <button class="btn btn-info btn-sm">Détails</button>
                </form>

                <form th:action="@{/api/equipements/equipement/{idEquipement}(idEquipement=${equipement.id})}" th:method="DELETE" style="display:inline;">
                    <button class="btn btn-warning btn-sm">Supprimez</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(equipements)}">
            <td colspan="8" class="text-center text-muted">Aucun équipement.</td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/api/equipements/equipement/nouveau}">
        <button class="btn btn-primary">Ajoutez</button>
    </form>

</div>
</body>
</html>
