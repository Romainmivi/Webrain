<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des agents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <h1>Liste des Agents</h1>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Nom</th>
            <th scope="col">Prénom</th>
            <th scope="col">Login</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="agent : ${agents}">
            <td th:text="${agent.id}"></td>
            <td th:text="${agent.nom}"></td>
            <td th:text="${agent.prenom}"></td>
            <td th:text="${agent.login}"></td>
            <td>
                <form th:action="@{/api/personnes/getAgent/{idAgent}(idAgent=${agent.id})}" style="display:inline;">
                    <button class="btn btn-info btn-sm">Détails</button>
                </form>

                <form th:action="@{/api/personnes/agent/{idAgent}(idAgent=${agent.id})}" th:method="DELETE" style="display:inline;">
                    <button class="btn btn-warning btn-sm">Supprimez</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(agent)}">
            <td colspan="8" class="text-center text-muted">Aucun agent.</td>
        </tr>
        </tbody>
    </table>

    <form th:action="@{/api/personnes/agent/nouveau}">
        <button class="btn btn-primary">Ajoutez</button>
    </form>

</div>
</body>
</html>
