<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des incidents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Liste des incidents</h1>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th>Id</th>
            <th>Équipement</th>
            <th>Agent</th>
            <th>Prestataire</th>
            <th>Date d'ouverture</th>
            <th>Statut</th>
            <th>Description</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="incident : ${incidents}">
            <td th:text="${incident.id}"></td>
            <td th:text="${incident.equipement.id + ' - ' + incident.equipement.description}"></td>
            <td th:text="${incident.agent.prenom + ' ' + incident.agent.nom}"></td>
            <td th:text="${incident.prestataire != null ? incident.prestataire.nom : '-'}"></td>
            <td th:text="${incident.dateOuverture}"></td>
            <td th:text="${incident.status}"></td>
            <td th:text="${incident.description}"></td>
            <td>
                <a class="btn btn-info btn-sm"
                   th:href="@{/api/incidents/getIncident/{id}(id=${incident.id})}">Détails</a>
                <form th:action="@{/api/incidents/incident/{id}(id=${incident.id})}"
                      th:method="DELETE" class="d-inline">
                    <button class="btn btn-warning btn-sm" type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(incidents)}">
            <td colspan="8" class="text-center text-muted">Aucun incident.</td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-primary" th:href="@{/api/incidents/incident/nouveau}">Déclarer un incident</a>
</div>
</body>
</html>
