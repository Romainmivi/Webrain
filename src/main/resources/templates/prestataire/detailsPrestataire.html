<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>Détails du prestataire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<th:block th:replace="~{fragment/navbar :: nav}"></th:block>
<div class="container mt-4">
    <h1>Détails du prestataire</h1>

    <section id="prestataireDetails">
        <dl class="row">
            <dt class="col-sm-3">Nom</dt>
            <dd class="col-sm-9" th:text="${prestataire.nom}"></dd>
            <dt class="col-sm-3">Téléphone</dt>
            <dd class="col-sm-9" th:text="${prestataire.numTelephone}"></dd>
            <dt class="col-sm-3">Email</dt>
            <dd class="col-sm-9" th:text="${prestataire.email}"></dd>
            <dt class="col-sm-3">Moyenne des 5 dernières évaluations</dt>
            <dd class="col-sm-9">
                <span th:if="${etatSurveillance.moyenneDernieresEvaluations != null}"
                      th:text="${#numbers.formatDecimal(etatSurveillance.moyenneDernieresEvaluations, 1, 1) + ' / 5'}"></span>
                <span th:unless="${etatSurveillance.moyenneDernieresEvaluations != null}">
                    Non calculée (moins de 5 évaluations)
                </span>
                <span th:if="${etatSurveillance.sousSurveillance}" class="badge text-bg-warning ms-2">
                    sous surveillance
                </span>
            </dd>
        </dl>
        <button type="button" class="btn btn-primary" onclick="toggleEdit(true)">Modifier</button>
    </section>

    <form id="prestataireForm" hidden
          th:object="${prestataire}"
          th:action="@{/api/prestataires/getPrestataire/{id}(id=${prestataire.id})}"
          th:method="PUT">
        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50" maxlength="100" required>
        <label class="form-label" for="numTelephone">Téléphone</label>
        <input type="tel" th:field="*{numTelephone}" class="form-control mb-3 w-50" maxlength="16" required>
        <label class="form-label" for="email">Email</label>
        <input type="email" th:field="*{email}" class="form-control mb-3 w-50" maxlength="100" required>
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <button type="button" class="btn btn-secondary" onclick="toggleEdit(false)">Annuler</button>
    </form>

    <section class="mt-4">
        <h2 class="h4">Évaluations reçues</h2>
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Incident</th>
                <th>Note</th>
                <th>Commentaire</th>
                <th>Date</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="evaluation : ${evaluations}">
                <td th:text="${evaluation.incident.id}"></td>
                <td th:text="${evaluation.note + ' / 5'}"></td>
                <td th:text="${evaluation.commentaire ?: 'Aucun commentaire'}"></td>
                <td th:text="${evaluation.date}"></td>
            </tr>
            <tr th:if="${#lists.isEmpty(evaluations)}">
                <td colspan="4" class="text-center text-muted">Aucune évaluation reçue.</td>
            </tr>
            </tbody>
        </table>
    </section>

    <hr>
    <a th:href="@{/api/prestataires/getPrestataires}">Retour à la liste des prestataires</a>
</div>
<script>
    function toggleEdit(editing) {
        document.getElementById("prestataireDetails").hidden = editing;
        document.getElementById("prestataireForm").hidden = !editing;
    }
</script>
</body>
</html>
