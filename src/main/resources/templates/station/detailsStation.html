<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Un responsable</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Details station</h1>

    <form th:object="${station}" th:action="@{/api/stations/getStation/{idStation}(idStation=${station.id})}" th:method="PUT">

        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50">

        <label class="form-label" for="prenom">Adresse</label>
        <input type="text" th:field="*{adresse}" class="form-control mb-3 w-50">

        <label class="form-label" for="login">Ville</label>
        <input type="text" th:field="*{ville}" class="form-control mb-3 w-50">

        <button type="submit" class="btn btn-primary">Validez modifications</button>
    </form>

    <hr>
    <a th:href="@{/api/stations/getStations}">Afficher la liste des stations</a>
</div>
</body>
</html>
