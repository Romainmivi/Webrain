<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Un agent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Details équipement</h1>

    <form th:object="${equipement}" th:action="@{/api/equipements/getEquipement/{idEquipement}(idEquipement=${equipement.id})}" th:method="PUT">

        <label class="form-label" for="nom">Description</label>
        <input type="text" th:field="*{description}" class="form-control mb-3 w-50">

        <label class="form-label" for="prenom">Type</label>
        <input type="text" th:field="*{type}" class="form-control mb-3 w-50">

        <label class="form-label" for="Station">Station</label>
        <input type="text" th:field="*{station.nom}" class="form-control mb-3 w-50">

        <label class="form-label" for="Etat">État</label>
        <input type="text" th:field="*{etat}" class="form-control mb-3 w-50">

        <button type="submit" class="btn btn-primary">Validez modifications</button>
    </form>

    <hr>
    <a th:href="@{/api/equipements/getEquipements}">Afficher la liste des équipement</a>
</div>
</body>
</html>
