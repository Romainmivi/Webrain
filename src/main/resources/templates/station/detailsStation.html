<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails de la station</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Détails de la station</h1>

    <section id="stationDetails">
        <dl class="row">
            <dt class="col-sm-3">Nom</dt>
            <dd class="col-sm-9" th:text="${station.nom}"></dd>
            <dt class="col-sm-3">Adresse</dt>
            <dd class="col-sm-9" th:text="${station.adresse}"></dd>
            <dt class="col-sm-3">Ville</dt>
            <dd class="col-sm-9" th:text="${station.ville}"></dd>
            <dt class="col-sm-3">Latitude</dt>
            <dd class="col-sm-9" th:text="${station.latitude}"></dd>
            <dt class="col-sm-3">Longitude</dt>
            <dd class="col-sm-9" th:text="${station.longitude}"></dd>
        </dl>
        <button type="button" class="btn btn-primary" onclick="toggleEdit(true)">Modifier</button>
    </section>

    <form id="stationForm" hidden
          th:object="${station}"
          th:action="@{/api/stations/getStation/{id}(id=${station.id})}"
          th:method="PUT">
        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50" maxlength="100" required>
        <label class="form-label" for="adresse">Adresse</label>
        <input type="text" th:field="*{adresse}" class="form-control mb-3 w-50" maxlength="100" required>
        <label class="form-label" for="ville">Ville</label>
        <input type="text" th:field="*{ville}" class="form-control mb-3 w-50" maxlength="100" required>
        <button type="submit" class="btn btn-success">Enregistrer</button>
        <button type="button" class="btn btn-secondary" onclick="toggleEdit(false)">Annuler</button>
    </form>

    <hr>
    <a th:href="@{/api/stations/getStations}">Retour à la liste des stations</a>
</div>
<script>
    function toggleEdit(editing) {
        document.getElementById("stationDetails").hidden = editing;
        document.getElementById("stationForm").hidden = !editing;
    }
</script>
</body>
</html>
