<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouveau prestataire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Ajout d'un prestataire</h1>

    <form th:action="@{/api/prestataires/addPrestataire}"
          th:object="${nouveauPrestataire}"
          method="POST">
        <label class="form-label" for="nom">Nom</label>
        <input type="text" th:field="*{nom}" class="form-control mb-3 w-50" maxlength="100" required>

        <label class="form-label" for="numTelephone">Téléphone</label>
        <input type="tel" th:field="*{numTelephone}" class="form-control mb-3 w-50" maxlength="16" required>

        <label class="form-label" for="email">Email</label>
        <input type="email" th:field="*{email}" class="form-control mb-3 w-50" maxlength="100" required>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>

    <hr>
    <a th:href="@{/api/prestataires/getPrestataires}">Afficher la liste des prestataires</a>
</div>
</body>
</html>
