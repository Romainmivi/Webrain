<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des prestataires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Liste des prestataires</h1>

    <table class="table table-striped table-hover align-middle">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Nom</th>
            <th scope="col">Téléphone</th>
            <th scope="col">Email</th>
            <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="prestataire : ${prestataires}">
            <td th:text="${prestataire.id}"></td>
            <td th:text="${prestataire.nom}"></td>
            <td th:text="${prestataire.numTelephone}"></td>
            <td th:text="${prestataire.email}"></td>
            <td>
                <a class="btn btn-info btn-sm"
                   th:href="@{/api/prestataires/getPrestataire/{id}(id=${prestataire.id})}">Détails</a>
                <form th:action="@{/api/prestataires/prestataire/{id}(id=${prestataire.id})}"
                      th:method="DELETE" class="d-inline">
                    <button class="btn btn-warning btn-sm" type="submit">Supprimer</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(prestataires)}">
            <td colspan="5" class="text-center text-muted">Aucun prestataire.</td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-primary" th:href="@{/api/prestataires/prestataire/nouveau}">Ajouter un prestataire</a>
</div>
</body>
</html>
