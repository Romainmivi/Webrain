<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détails du prestataire</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Détails du prestataire</h1>

    <dl class="row">
        <dt class="col-sm-2">Id</dt>
        <dd class="col-sm-10" th:text="${prestataire.id}"></dd>

        <dt class="col-sm-2">Nom</dt>
        <dd class="col-sm-10" th:text="${prestataire.nom}"></dd>

        <dt class="col-sm-2">Téléphone</dt>
        <dd class="col-sm-10" th:text="${prestataire.numTelephone}"></dd>

        <dt class="col-sm-2">Email</dt>
        <dd class="col-sm-10" th:text="${prestataire.email}"></dd>
    </dl>

    <a th:href="@{/api/prestataires/getPrestataires}">Retour à la liste des prestataires</a>
</div>
</body>
</html>
