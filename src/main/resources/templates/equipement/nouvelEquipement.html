<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ALTN72 - TP Fil Rouge - Nouvel équipement</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Ajout d'un nouvel équipement</h1>

    <form th:action="@{/api/equipements/addEquipement}"
          th:object="${nouvelEquipement}"
          method="POST">
        <label class="form-label" for="description">Description</label>
        <input type="text" th:field="*{description}" class="form-control mb-3 w-50">

        <label class="form-label" for="typeEquipement">Type d'équipement</label>
        <select th:field="*{typeEquipement}" class="form-select mb-3 w-50" required>
            <option value="" disabled>Choisir un type</option>
            <option th:each="type : ${typesEquipement}"
                    th:value="${type}"
                    th:text="${type.libelle}">
            </option>
        </select>

        <label class="form-label" for="idStation">Station</label>
        <select th:field="*{idStation}" class="form-select mb-3 w-50" required>
            <option value="" disabled>Choisir une station</option>
            <option th:each="station : ${stationsDisponible}"
                    th:value="${station.id}"
                    th:text="${station.nom}">
            </option>
        </select>

        <label class="form-label" for="etat">État</label>
        <select th:field="*{etat}" class="form-select mb-3 w-50" required>
            <option value="" disabled>Choisir un état</option>
            <option th:each="etat : ${etatsEquipement}"
                    th:value="${etat}"
                    th:text="${etat}">
            </option>
        </select>

        <button type="submit" class="btn btn-primary">Enregistrer</button>
    </form>

    <hr>
    <a th:href="@{/api/equipements/getEquipements}">Afficher la liste des équipements</a>
</div>
</body>
</html>
